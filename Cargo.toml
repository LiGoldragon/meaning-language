[package]
name = "meaning-language"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/meaning-language"
description = "Proposal Ethos library for a bilingual Sanskrit-English meaning language."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:protos"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb", features = ["rkyv"] }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", features = ["rkyv"], optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "c2653dd82adbdb1f1f2f654405c6620e0d06fd58" }

[[test]]
name = "datom_roundtrip"
path = "tests/datom_roundtrip.rs"
required-features = ["datom"]

[[test]]
name = "archive_roundtrip"
path = "tests/archive_roundtrip.rs"

[lints.rust]
unsafe_code = "forbid"
